<header class="site-header">
  <div class="header-container">
    <a href="{{ '/' | relative_url }}" class="site-logo">
      <img src="{{ '/assets/images/logo.png' | relative_url }}" alt="Lyckan - förskola och fritids i Näshult" class="logo-img">
    </a>
    <button class="menu-toggle" aria-label="Öppna meny" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="site-nav" aria-label="Huvudnavigering">
      <ul class="nav-list">
        {% for item in site.navigation %}
        <li class="nav-item {% if item.children %}has-children{% endif %}">
          <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active"{% endif %}>
            {{ item.title }}
          </a>
          {% if item.children %}
          <ul class="nav-children">
            {% for child in item.children %}
            <li><a href="{{ child.url | relative_url }}" {% if page.url == child.url %}class="active"{% endif %}>{{ child.title }}</a></li>
            {% endfor %}
          </ul>
          {% endif %}
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
